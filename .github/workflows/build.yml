name: Build Cubic Discord Bot

on:
    push:
        branches: [master]
    pull_request:

jobs:
    build:
        name: "Compile Source"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: lukka/get-cmake@v4.3.3

            - name: Setup vcpkg
              uses: lukka/run-vcpkg@v11
              with:
                  vcpkgGitCommitId: "f3e10653cc27d62a37a3763cd84b38bca07c6075"
                  vcpkgDirectory: "${{ github.workspace }}/vcpkg"

            - name: Use vcpkg cache
              uses: actions/cache@v5
              with:
                  path: |
                      ${{ github.workspace }}/vcpkg/packages
                      ${{ github.workspace }}/vcpkg/downloads
                      ${{ github.workspace }}/build/vcpkg_installed
                  key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vcpkg.json') }}
                  restore-keys: |
                      vcpkg-${{ runner.os }}-

            - name: Configure CMake
              run: "cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DVCPKG_BUILD_TYPE=release -DVCPKG_TARGET_TRIPLET=x64-linux -DBUILD_SHARED_LIBS=OFF"
              env:
                  CC: clang
                  CXX: clang++

            - name: Build
              run: cmake --build build --config Release -j$(nproc)

            # i have no idea how else to get the runtime libs :(
            - name: Collect runtime libraries
              run: |
                  ls -l vcpkg/packages/*_x64-linux/lib || true
                  ldd build/CubicDiscord
                  mkdir -p artifacts/libs
                  cp vcpkg/packages/*_x64-linux/lib/*.so* artifacts/libs/ || true
                  ls -l artifacts/libs || true

            - uses: actions/upload-artifact@v7
              with:
                  name: cubicdiscord-linux
                  path: build/CubicDiscord

            - uses: actions/upload-artifact@v7
              with:
                  name: cubicdiscord-libs
                  path: artifacts/libs

    nightly:
        name: Nightly Release
        runs-on: ubuntu-latest
        needs: ["build"]
        permissions:
            contents: write

        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: ./artifacts/
                  merge-multiple: true

            - name: Get latest release tag
              id: getrelease
              run: echo "tag=$(curl -s https://api.github.com/repos/${{ github.event.repository.full_name }}/releases/latest | jq -r '.tag_name // "${{ github.event.repository.default_branch }}"')" >> $GITHUB_OUTPUT

            - name: Publish Nightly release
              id: publish-nightly
              if: ${{ github.ref_name == github.event.repository.default_branch }}
              uses: andelf/nightly-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: dev
                  name: "Development Release"
                  body: |
                      **Development build for commit ${{ github.sha }}**.
                      > [`View Current Changes`](${{ github.event.repository.html_url }}/compare/${{ steps.getrelease.outputs.tag }}...nightly)
                  files: |
                      ./artifacts/**/*
