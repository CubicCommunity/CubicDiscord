name: Build Source

on:
    push:
        branches: [master]
    pull_request:

jobs:
    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: lukka/get-cmake@v4.3.2

            - name: Setup vcpkg
              uses: lukka/run-vcpkg@v11
              with:
                  vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"
                  vcpkgDirectory: "${{ github.workspace }}/vcpkg"

            - name: Cache vcpkg artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      ${{ github.workspace }}/vcpkg/packages
                      ${{ github.workspace }}/vcpkg/downloads
                      ${{ github.workspace }}/build/vcpkg_installed
                  key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
                  restore-keys: |
                      vcpkg-${{ runner.os }}-

            - name: Configure CMake
              run: "cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release"
              env:
                  CC: clang
                  CXX: clang++

            - name: Build
              run: cmake --build build --config Release -j$(nproc)

            - uses: actions/upload-artifact@v7
              with:
                  name: cubicdiscord-linux
                  path: build/CubicDiscord

            - uses: actions/upload-artifact@v7
              with:
                  name: cubicdiscord-libs
                  path: artifacts/libs

    nightly:
        name: Nightly Release
        runs-on: ubuntu-latest
        needs: ["build-linux"]
        permissions:
            contents: write

        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: ./artifacts/
                  merge-multiple: true

            - name: Get latest release tag
              id: getrelease
              run: echo "tag=$(curl -s https://api.github.com/repos/${{ github.event.repository.full_name }}/releases/latest | jq -r '.tag_name // "${{ github.event.repository.default_branch }}"')" >> $GITHUB_OUTPUT

            - name: Publish Nightly release
              id: publish-nightly
              if: ${{ github.ref_name == github.event.repository.default_branch }}
              uses: andelf/nightly-release@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: dev
                  name: "Development Release"
                  body: |
                      **Development build for commit ${{ github.sha }}**.
                      > [`View Current Changes`](${{ github.event.repository.html_url }}/compare/${{ steps.getrelease.outputs.tag }}...nightly)
                  files: |
                      ./artifacts/**/*
