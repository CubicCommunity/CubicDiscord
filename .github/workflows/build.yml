name: Build Source

on:
    push:
        branches: [master]
    pull_request:

jobs:
    build-linux:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: lukka/get-cmake@v4.3.2

            - name: Setup vcpkg
              uses: lukka/run-vcpkg@v11
              with:
                  vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"
                  vcpkgDirectory: "${{ github.workspace }}/vcpkg"

            - name: Install newer Clang
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang-19 lld-19
                  sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100
                  sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100

            - name: Configure CMake
              run: "cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DVCPKG_BUILD_TYPE=release -DVCPKG_TARGET_TRIPLET=x64-linux"

              env:
                  CC: clang
                  CXX: clang++

            - name: Build
              run: cmake --build build --config Release -j$(nproc)

            - uses: actions/upload-artifact@v4
              with:
                  name: cubicdiscord-linux
                  path: build/CubicDiscord
